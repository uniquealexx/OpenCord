name: Deploy Help API docs to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "help-docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege for Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-help-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy help-docs to Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate help-docs bundle
        shell: bash
        run: |
          test -f help-docs/index.html || { echo "Missing help-docs/index.html" >&2; exit 1; }
          test -f help-docs/help-api.js || { echo "Missing help-docs/help-api.js" >&2; exit 1; }
          test -f help-docs/examples.js || { echo "Missing help-docs/examples.js" >&2; exit 1; }
          test -f help-docs/styles.css || { echo "Missing help-docs/styles.css" >&2; exit 1; }
          node --check help-docs/help-api.js
          node --check help-docs/examples.js
          # No secrets, no build step: pure static site.
          if grep -RIn --exclude-dir=node_modules -E "BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|ghp_|github_pat_|xox[bap]-|AKIA[0-9A-Z]{16}" help-docs; then
            echo "Potential secret in help-docs payload." >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload help-docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: help-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
