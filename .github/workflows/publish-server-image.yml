name: Publish OpenCord release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-opencord-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencord-server
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.9.0

jobs:
  publish:
    name: Build and publish server release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Validate release metadata
        id: release
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            channel="beta"
          elif [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="stable"
          else
            echo "Supported releases are X.Y.Z or X.Y.Z-beta.N." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate packages and contracts
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=beta,enable=${{ steps.release.outputs.channel == 'beta' }}
            type=raw,value=stable,enable=${{ steps.release.outputs.channel == 'stable' }}
            type=raw,value=latest
            type=raw,value=sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=OpenCord Server
            org.opencontainers.image.description=Self-hosted OpenCord text, file, identity, and voice coordination server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile.bundle
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCORD_VERSION=${{ steps.release.outputs.version }}
            OPENCORD_RELEASE_CHANNEL=${{ steps.release.outputs.channel }}
            OPENCORD_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record published digest
        shell: bash
        run: |
          echo "Published ${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Channel: ${{ steps.release.outputs.channel }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Tags: ${{ steps.release.outputs.version }}, ${{ steps.release.outputs.channel }}, latest, sha-${{ steps.release.outputs.short_sha }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build source-free server release bundle
        shell: bash
        run: |
          pnpm bundle:server -- \
            --channel "${{ steps.release.outputs.channel }}" \
            --server-image-reference "${REGISTRY}/${IMAGE_NAME}:${{ steps.release.outputs.version }}" \
            --server-image-digest "${{ steps.push.outputs.digest }}"

      - name: Upload server assets to a draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.release.outputs.version }}"
          bundle="release/opencord-server-${version}.tar.gz"
          assets=("${bundle}" "${bundle}.sha256" "release/release-manifest.json")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            title="OpenCord ${version}"
            if [[ "${{ steps.release.outputs.channel }}" == "beta" ]]; then title="${title} Beta"; fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --draft --generate-notes --title "${title}"
          fi

  publish-client:
    name: Build and publish Windows client
    needs: publish
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare "pnpm@${env:PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS update artifacts
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm package:win
          $version = "${{ needs.publish.outputs.version }}"
          $channel = "${{ needs.publish.outputs.channel }}"
          if ($channel -eq "beta") { Copy-Item -LiteralPath "client/release/latest.yml" -Destination "client/release/beta.yml" -Force }
          $metadata = if ($channel -eq "beta") { "beta.yml" } else { "latest.yml" }
          $required = @(
            "client/release/OpenCord-Setup-$version-x64.exe",
            "client/release/OpenCord-Setup-$version-x64.exe.blockmap",
            "client/release/$metadata"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing Windows release artifact: $file" }
          }

      - name: Attach Windows artifacts to release manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.publish.outputs.version }}"
          $channel = "${{ needs.publish.outputs.channel }}"
          $metadata = if ($channel -eq "beta") { "beta.yml" } else { "latest.yml" }
          gh release download "${env:GITHUB_REF_NAME}" --pattern "release-manifest.json" --dir "release-input" --clobber
          node scripts/release-manifest.mjs --attach-windows-client `
            --manifest "release-input/release-manifest.json" `
            --installer "client/release/OpenCord-Setup-$version-x64.exe" `
            --update-metadata "client/release/$metadata" `
            --blockmap "client/release/OpenCord-Setup-$version-x64.exe.blockmap"
          pnpm manifest:validate -- "release-input/release-manifest.json"

      - name: Publish Windows assets and finalize release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.publish.outputs.version }}"
          $channel = "${{ needs.publish.outputs.channel }}"
          $metadata = if ($channel -eq "beta") { "beta.yml" } else { "latest.yml" }
          $wasDraft = gh release view "${env:GITHUB_REF_NAME}" --json isDraft --jq '.isDraft'
          gh release upload "${env:GITHUB_REF_NAME}" `
            "client/release/OpenCord-Setup-$version-x64.exe" `
            "client/release/OpenCord-Setup-$version-x64.exe.blockmap" `
            "client/release/$metadata" `
            "release-input/release-manifest.json" --clobber
          if ($wasDraft -eq "true") {
            if ($channel -eq "beta") {
              gh release edit "${env:GITHUB_REF_NAME}" --draft=false --prerelease
            } else {
              gh release edit "${env:GITHUB_REF_NAME}" --draft=false --latest
            }
          }

      - name: Publish separate server release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.publish.outputs.version }}"
          $channel = "${{ needs.publish.outputs.channel }}"
          $serverTag = "server-v$version"
          $serverTitle = "OpenCord Server $version"
          if ($channel -eq "beta") { $serverTitle = "$serverTitle Beta" }
          New-Item -ItemType Directory -Path "server-release" -Force | Out-Null
          gh release download "${env:GITHUB_REF_NAME}" `
            --pattern "opencord-server-$version.tar.gz" `
            --pattern "opencord-server-$version.tar.gz.sha256" `
            --dir "server-release" --clobber
          Copy-Item -LiteralPath "release-input/release-manifest.json" -Destination "server-release/release-manifest.json" -Force
          $assets = @(
            "server-release/opencord-server-$version.tar.gz",
            "server-release/opencord-server-$version.tar.gz.sha256",
            "server-release/release-manifest.json"
          )
          gh release view $serverTag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $serverTag $assets --clobber
            gh release edit $serverTag --title $serverTitle
          } elseif ($channel -eq "beta") {
            gh release create $serverTag $assets --target "${env:GITHUB_SHA}" --title $serverTitle --notes "Server-only artifacts for OpenCord $version." --prerelease
          } else {
            gh release create $serverTag $assets --target "${env:GITHUB_SHA}" --title $serverTitle --notes "Server-only artifacts for OpenCord $version."
          }
