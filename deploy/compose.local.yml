name: opencord-local

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bundle
      target: runtime
      args:
        OPENCORD_VERSION: ${OPENCORD_VERSION}
        OPENCORD_RELEASE_CHANNEL: ${OPENCORD_RELEASE_CHANNEL:-development}
        OPENCORD_BUILD_COMMIT: ${OPENCORD_BUILD_COMMIT:-}
    environment:
      ALLOW_INSECURE_FIRST_USER_OWNER: "true"
      LIVEKIT_PUBLIC_URL: ws://127.0.0.1:7882
      VOICE_SECURE_MODE: "false"
    ports:
      - "127.0.0.1:3210:3210"
  attachments-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bundle
      target: runtime
      args:
        OPENCORD_VERSION: ${OPENCORD_VERSION}
        OPENCORD_RELEASE_CHANNEL: ${OPENCORD_RELEASE_CHANNEL:-development}
        OPENCORD_BUILD_COMMIT: ${OPENCORD_BUILD_COMMIT:-}

  livekit:
    environment:
      # За NAT Docker Desktop STUN находит публичный IP роутера, недостижимый с хоста:
      # анонсируем 127.0.0.1 (клиент на том же хосте, порты уже проброшены на localhost).
      LIVEKIT_USE_EXTERNAL_IP: "false"
      LIVEKIT_NODE_IP: "127.0.0.1"
    ports:
      - "127.0.0.1:7882:7880"
