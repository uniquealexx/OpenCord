name: opencord

services:
  database:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: opencord
      POSTGRES_USER: opencord
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencord -d opencord"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - backend

  server:
    image: ghcr.io/uniquealexx/opencord-server:${OPENCORD_VERSION:?Set OPENCORD_VERSION in deploy/.env}
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      LOG_LEVEL: ${SERVER_LOG_LEVEL:-info}
      DATABASE_URL_FILE: /run/secrets/database_url
      BOOTSTRAP_OWNER_PUBLIC_KEY_FILE: /run/secrets/owner_public_key
      SERVER_NAME_FILE: /run/secrets/server_name
      DEPLOYMENT_ID_FILE: /run/secrets/deployment_id
      ATTACHMENTS_DIR: /var/lib/opencord/attachments
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://voice.${OPENCORD_DOMAIN}
      LIVEKIT_API_KEY_FILE: /run/secrets/livekit_api_key
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
      VOICE_SECURE_MODE: "true"
      VOICE_MAX_PARTICIPANTS: "25"
    secrets:
      - database_url
      - owner_public_key
      - server_name
      - deployment_id
      - livekit_api_key
      - livekit_api_secret
    depends_on:
      database:
        condition: service_healthy
        restart: true
      attachments-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    expose:
      - "3210"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/health').then(async r=>{const h=await r.json();if(!r.ok||h.status!=='ok'||h.service!=='opencord-server')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - attachments_data:/var/lib/opencord/attachments
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge

  livekit:
    image: livekit/livekit-server:v1.9.10
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["sh", "/usr/local/bin/opencord-livekit-entrypoint"]
    environment:
      LIVEKIT_WEBHOOK_URL: http://server:3210/internal/livekit/webhook
    secrets:
      - livekit_api_key
      - livekit_api_secret
    ports:
      - "3478:3478/udp"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    expose:
      - "7880"
    volumes:
      - ./deploy/livekit-entrypoint.sh:/usr/local/bin/opencord-livekit-entrypoint:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge

  attachments-init:
    image: ghcr.io/uniquealexx/opencord-server:${OPENCORD_VERSION:?Set OPENCORD_VERSION in deploy/.env}
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 10001:10001 /data && chmod 0700 /data"]
    restart: "no"
    read_only: true
    volumes:
      - attachments_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      OPENCORD_DOMAIN: ${OPENCORD_DOMAIN:?Set OPENCORD_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
        restart: true
      livekit:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password
  database_url:
    file: ./deploy/secrets/database_url
  owner_public_key:
    file: ./deploy/secrets/owner_public_key
  server_name:
    file: ./deploy/secrets/server_name
  deployment_id:
    file: ./deploy/secrets/deployment_id
  livekit_api_key:
    file: ./deploy/secrets/livekit_api_key
  livekit_api_secret:
    file: ./deploy/secrets/livekit_api_secret

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  attachments_data:

networks:
  backend:
    internal: true
  edge:
