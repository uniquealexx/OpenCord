name: opencord

services:
  database:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: opencord
      POSTGRES_USER: opencord
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencord -d opencord"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - backend

  server:
    image: opencord-server:${OPENCORD_VERSION:-local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      LOG_LEVEL: ${SERVER_LOG_LEVEL:-info}
      DATABASE_URL_FILE: /run/secrets/database_url
      BOOTSTRAP_OWNER_PUBLIC_KEY_FILE: /run/secrets/owner_public_key
      SERVER_NAME_FILE: /run/secrets/server_name
      DEPLOYMENT_ID_FILE: /run/secrets/deployment_id
    secrets:
      - database_url
      - owner_public_key
      - server_name
      - deployment_id
    depends_on:
      database:
        condition: service_healthy
        restart: true
    expose:
      - "3210"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      OPENCORD_DOMAIN: ${OPENCORD_DOMAIN:?Set OPENCORD_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password
  database_url:
    file: ./deploy/secrets/database_url
  owner_public_key:
    file: ./deploy/secrets/owner_public_key
  server_name:
    file: ./deploy/secrets/server_name
  deployment_id:
    file: ./deploy/secrets/deployment_id

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
